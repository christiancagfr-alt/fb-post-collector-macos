name: Build macOS installers
on:
  workflow_dispatch:
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      # Intel cryptography is compiled from source; do not mix its OpenSSL
      # with the different libssl bundled by the Python distribution.
      OPENSSL_STATIC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Isolate test data
        run: echo "FB_COLLECTOR_DATA_DIR=$RUNNER_TEMP/collector-test-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Run tests
        run: python scripts/run_tests.py
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm FBPostCollector-macos.spec
      - name: Verify application
        run: |
          codesign --verify --deep --strict dist/FBPostCollector.app
          python scripts/smoke_macos.py
      - name: Create DMG
        run: |
          mkdir -p dmg-stage installer_output
          cp -R dist/FBPostCollector.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          cp MAC_INSTALL.txt dmg-stage/
          hdiutil create -volname FBPostCollector -srcfolder dmg-stage -ov -format UDZO installer_output/FBPostCollector-v1.4.18-macos-${{ matrix.arch }}.dmg
          cd installer_output
          shasum -a 256 *.dmg > SHA256-${{ matrix.arch }}.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: installer_output/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: installer_output/*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: release-assets
      - name: Publish to personal repository only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GH_REPO" = "christiancagfr-alt/fb-post-collector-macos"
          cp docs/FEATURE-GUIDE-v1.4.18.txt release-assets/
          gh release create v1.4.18 release-assets/* --target "$GITHUB_SHA" --title "v1.4.18 — macOS 安全加固版" --notes-file MAC_RELEASE_NOTES.txt --latest
