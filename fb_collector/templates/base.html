<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facebook 贴文采集工具 v{{ app_version }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">FB贴文数据采集</div>
    <div class="brand-version">版本 v{{ app_version }}</div>
    <nav class="side-nav">
      <a href="{{ url_for('index') }}">项目</a>
      <a href="{{ url_for('browser_accounts') }}">浏览器账号</a>
      <a href="{{ url_for('drive_accounts') }}">Google 云盘账号</a>
      <a href="{{ url_for('tasks') }}">任务</a>
      <a href="{{ url_for('runs') }}">运行记录</a>
      <a href="{{ url_for('environment') }}">环境检测</a>
      <a href="{{ url_for('updates') }}">检查更新</a>
      <a href="{{ url_for('settings') }}">授权设置</a>
    </nav>
  </aside>
  <div class="app-shell">
    <header class="pagebar">
      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="history.back()">返回上一页</button>
    </header>
    <main class="container-fluid page-container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
